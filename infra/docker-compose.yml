version: '3.9'

services:
  # Redis — used for BullMQ queue and rate limiting
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Redis Commander — optional web UI for Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    profiles:
      - debug

  # API — Express backend (for local dev, run with pnpm dev in apps/api)
  # Uncomment to run API in Docker
  # api:
  #   build:
  #     context: ..
  #     dockerfile: infra/Dockerfile.api
  #   restart: unless-stopped
  #   ports:
  #     - '3001:3001'
  #   environment:
  #     - NODE_ENV=development
  #     - REDIS_URL=redis://redis:6379
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  redis_data:
